[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontology-management-base"
version = "0.3.0"
description = "Ontology validation tools and management for the ENVITED-X ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "EPL-2.0" }
authors = [
    { name = "ASCS-EV", email = "info@asc-s.de" }
]
keywords = ["ontology", "shacl", "owl", "validation", "semantic-web", "json-ld"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Eclipse Public License 2.0 (EPL-2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "rdflib>=7.6.0",
    "pyshacl>=0.31.0",
    "oxrdflib>=0.5.0",
]

[project.optional-dependencies]
publish = [
    # Optional Gaia-X Federated Catalogue / EDC publishing stack. Only needed for
    # omb/uploaders and omb/authhelper; NOT required to validate.
    "keycloak_client>=0.15.4",
    "requests>=2.32.5",
]
dev = [
    "ruff>=0.15.0",
    # linkml: in [dev] for standalone pip install; the submodule pin in
    # submodules/linkml/ is the single source of truth for the actual version.
    "linkml @ git+https://github.com/ASCS-eV/linkml.git@feat/envited-x-pipeline#subdirectory=packages/linkml",
    "pre-commit==4.5.1",
    "mkdocs-material>=9.5.0",
    "mkdocs-awesome-pages-plugin>=2.9.3",
    "mkdocs-exclude>=1.0.0",
    "mkdocstrings[python]>=0.24.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-awesome-pages-plugin>=2.9.3",
    "mkdocs-exclude>=1.0.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/ASCS-eV/ontology-management-base"
Documentation = "https://ascs-ev.github.io/ontology-management-base/"
Repository = "https://github.com/ASCS-eV/ontology-management-base.git"
Issues = "https://github.com/ASCS-eV/ontology-management-base/issues"

[project.scripts]
onto-validate = "omb.validators.validation_suite:main"
onto-check-conformance = "omb.validators.conformance_validator:main"
onto-check-coherence = "omb.validators.coherence_validator:main"
onto-generate-docs = "omb.utils.properties_updater:main"
onto-generate-context = "omb.utils.context_generator:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["omb"]

[tool.hatch.build.targets.wheel.force-include]
"artifacts" = "omb/data/artifacts"
"imports" = "omb/data/imports"
"docs/registry.json" = "omb/data/docs/registry.json"

[tool.hatch.build.targets.sdist]
include = ["omb", "artifacts", "imports", "docs/registry.json", "pyproject.toml", "README.md", "LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
ignore = [
    "E501",   # line too long (formatter handles it)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:omb.validators.*",
]

[tool.coverage.run]
source = ["omb"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
