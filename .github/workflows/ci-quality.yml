name: CI - Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- JOB 0: Determine Changes ---
  changes:
    name: Determine Changes
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.filter.outputs.domains }}
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed folders
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="origin/${{ github.base_ref }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]; then
               BASE_SHA="HEAD^"
            fi
          fi

          echo "Diffing against: $BASE_SHA"
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD)

          if echo "$CHANGED_FILES" | grep -qE "^(omb/|imports/|config/|submodules/|.github/|pyproject.toml|requirements.txt)"; then
            echo "Core configuration or code changed. Running full suite."
            echo "domains=" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            TARGETS=""
            for file in $(echo "$CHANGED_FILES" | grep "^artifacts/"); do
              domain=$(echo "$file" | cut -d/ -f2)
              if [ -d "tests/data/$domain" ] && [[ ! "$domain" =~ ^(docs|jsonld|owl|shacl)$ ]]; then
                TARGETS="$TARGETS $domain"
              fi
            done
            for file in $(echo "$CHANGED_FILES" | grep "^tests/data/"); do
              domain=$(echo "$file" | cut -d/ -f3)
              if [ -d "tests/data/$domain" ]; then
                TARGETS="$TARGETS $domain"
              fi
            done

            TARGETS=$(echo "$TARGETS" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)

            if [ -z "$TARGETS" ]; then
              echo "No relevant ontology domains changed."
              echo "should_run=false" >> $GITHUB_OUTPUT
            else
              echo "Targeting domains: $TARGETS"
              echo "domains=--domain $TARGETS" >> $GITHUB_OUTPUT
              echo "should_run=true" >> $GITHUB_OUTPUT
            fi
          fi

  # --- JOB 1: Standards & Syntax ---
  standards-and-syntax:
    name: Standards & Syntax
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run pre-commit
        run: |
          # Hooks like update-registry and update-properties may regenerate
          # files (e.g., registry.json includes a timestamp that changes per-run).
          # Run hooks, then verify only formatting/lint hooks produce no diff.
          just lint || true

          # Check if only auto-generated files changed (registry, properties, catalog)
          UNEXPECTED=$(git diff --name-only | grep -vE '(registry\.json|PROPERTIES\.md|properties\.md|catalog\.md|ontoenv\.toml|README\.md|context\.jsonld)' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Pre-commit hooks modified unexpected files:"
            echo "$UNEXPECTED"
            git diff -- $UNEXPECTED
            exit 1
          fi

  # --- JOB 1b: Generate Artifacts ---
  generate:
    name: Generate Artifacts
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Generate artifacts
        run: just generate
      - name: Normalize generated files (same as pre-commit hooks)
        run: uv run --frozen --group dev pre-commit run pretty-format-json --all-files || true
      - name: Verify no changes
        run: |
          CHANGES=$(git diff --name-only -- artifacts/)
          if [ -n "$CHANGES" ]; then
            echo "::error::just generate produced different artifacts than committed:"
            echo "$CHANGES"
            git diff -- artifacts/
            exit 1
          fi

  # --- JOB 2: SHACL Validation ---
  validate-shacl:
    name: SHACL Validation
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run SHACL Checks
        run: just validate --run check-data-conformance ${{ needs.changes.outputs.domains }}

  # --- JOB 3: OWL Consistency ---
  validate-owl:
    name: OWL Classes
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run Target Class Checks
        run: just validate --run check-artifact-coherence ${{ needs.changes.outputs.domains }}

  # --- JOB 4: Unit & Integration Tests ---
  unit-tests:
    name: Unit & Integration Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run validation suite
        run: just test
      # Until now nothing in CI ran pytest: this job's name promised unit tests but it
      # only invoked the validation suite. Assertions that need the pinned ASAM
      # submodules skip here (see the drift-guard job below) so the matrix stays cheap.
      - name: Run pytest suite
        run: just test-unit

  # --- JOB 4b: Pinned Standards Drift ---
  # Separate from the matrix on purpose: the ASAM standards submodule tree is ~260 MB,
  # so it is fetched once on ubuntu instead of six times across the matrix.
  # OMB_REQUIRE_PINNED_SOURCES turns the drift guard's "submodule missing" skip into a
  # hard failure, so the guard cannot silently stop running here.
  enum-drift:
    name: Pinned Standards Drift
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      OMB_REQUIRE_PINNED_SOURCES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Check out the pinned ASAM standards
        run: git submodule update --init --recursive --depth 1 submodules/asam-openx-standards
      - name: Check enumerations against their pinned sources
        run: just validate-enums
      # imports/opendrive and imports/openscenario are byte-for-byte copies of submodule
      # artifacts. Checked in this job because it is the one that already pays for the
      # ~260 MB submodule fetch. A submodule bump without a re-derive fails here.
      - name: Check the derived ASAM vocabularies against the submodule
        run: just asam-imports-check
      - name: Run the ASAM imports integration tests
        run: just test-asam-imports

  # --- JOB 5: Regression Tests ---
  regression-tests:
    name: Regression Tests
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run Failing Tests
        run: just validate --run check-failing-tests ${{ needs.changes.outputs.domains }}

  # --- JOB 6: Dev Container ---
  # Nothing else in CI builds Dockerfile/compose.yaml, so the exact class of bug this
  # file's history already hit once — a pyproject.toml force-include the image's COPY
  # list didn't cover — could regress silently on a future dependency or artifact change.
  # Always runs (not gated on `changes`): pyproject.toml, uv.lock and artifacts/ can all
  # break the build, and none of those are container-specific paths to filter on.
  dev-container:
    name: Dev Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Built with the runner's own ids so the ownership fix has something non-default
      # to prove: root and uid 1000 both being valid was never in question.
      - name: Build the image
        run: HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose build
      - name: Smoke test the toolchain
        run: |
          docker compose run --rm ontology-tools just --list
          docker compose run --rm ontology-tools just test-domain manifest
      - name: Files the container writes must be owned by the runner, not root
        run: |
          docker compose run --rm ontology-tools mkdir -p /workspace/.container-ci-check
          owner=$(stat -c '%u:%g' .container-ci-check)
          rm -rf .container-ci-check
          if [ "$owner" != "$(id -u):$(id -g)" ]; then
            echo "::error::a directory the container created is owned by $owner, not $(id -u):$(id -g)"
            exit 1
          fi
      - name: Tear down
        if: always()
        run: docker compose down -v

  # --- JOB 7: Dev Container on Windows, via Podman ---
  # The job above already proves the image and every recipe work under a real Linux
  # docker engine. WSL2 does not need a separate job to re-prove that: it runs a real
  # Linux kernel, so `docker compose` inside WSL2 exercises the exact same code path as
  # ubuntu-latest above — verified by hand (build, `just --list`, `just test-domain`,
  # `pytest`, and the non-root ownership fix all behave identically under WSL2's docker.io
  # engine). What that job cannot cover is the Windows-native path this PR's own commits
  # added support for: no Docker Desktop (no license under it), Podman instead, and NTFS
  # bind-mount semantics instead of a Linux filesystem's.
  #
  # That path was verified by hand too: `podman compose build` / `run` reproduce every
  # recipe correctly, and the container-reports-uid-1000-but-NTFS-shows-the-real-account
  # behaviour documented in docs/getting-started/container.md under "Windows" matches
  # exactly — `id` inside the container says uid=1000(omb), but a directory it creates
  # lands owned by the real Windows account with full control, never root, regardless of
  # HOST_UID/HOST_GID.
  #
  # Both `podman machine init` and a real WSL2 distro need nested virtualization that
  # GitHub-hosted windows-latest runners do not provide (confirmed: podman machine init
  # fails there). So this only runs on a self-hosted Windows runner with WSL2 already
  # enabled, and only on an explicit trigger — never on push/pull_request — so a repo
  # without such a runner registered never has a job hang waiting for one.
  dev-container-windows-podman:
    name: Dev Container (Windows, Podman)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Podman is available
        shell: pwsh
        run: |
          if (-not (Get-Command podman -ErrorAction SilentlyContinue)) {
            winget install --id RedHat.Podman -e --source winget --accept-source-agreements --accept-package-agreements --silent
          }
          podman --version
      - name: Ensure podman-compose is available
        shell: pwsh
        run: |
          if (-not (Get-Command podman-compose -ErrorAction SilentlyContinue)) {
            python -m pip install --user podman-compose
          }
      - name: Start the Podman machine
        shell: pwsh
        run: |
          $existing = podman machine list --format "{{.Name}}" 2>$null
          if (-not $existing) {
            podman machine init
          }
          podman machine start
      - name: Build the image
        shell: pwsh
        run: podman compose build
      - name: Smoke test the toolchain
        shell: pwsh
        run: |
          podman compose run --rm ontology-tools just --list
          podman compose run --rm ontology-tools just test-domain manifest
      # NTFS has no uid/gid, so the Linux-side ownership assertion the ubuntu-latest job
      # makes has no equivalent here — Windows enforces access through the NTFS
      # permissions of the account running Podman, not the container's uid, which is
      # exactly what docs/getting-started/container.md documents for this platform. This
      # step only proves the write itself succeeds and is readable/removable afterwards.
      - name: Files the container writes must be usable from the host afterwards
        shell: pwsh
        run: |
          podman compose run --rm ontology-tools mkdir -p /workspace/.container-ci-check
          if (-not (Test-Path .container-ci-check)) {
            Write-Error "the container's write is not visible on the host bind mount"
            exit 1
          }
          Remove-Item -Recurse -Force .container-ci-check
      - name: Tear down
        if: always()
        shell: pwsh
        run: podman compose down -v
