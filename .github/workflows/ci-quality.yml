name: CI - Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- JOB 0: Determine Changes ---
  changes:
    name: Determine Changes
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.filter.outputs.domains }}
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed folders
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="origin/${{ github.base_ref }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]; then
               BASE_SHA="HEAD^"
            fi
          fi

          echo "Diffing against: $BASE_SHA"
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD)

          if echo "$CHANGED_FILES" | grep -qE "^(omb/|imports/|config/|submodules/|.github/|pyproject.toml|requirements.txt)"; then
            echo "Core configuration or code changed. Running full suite."
            echo "domains=" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            TARGETS=""
            for file in $(echo "$CHANGED_FILES" | grep "^artifacts/"); do
              domain=$(echo "$file" | cut -d/ -f2)
              if [ -d "tests/data/$domain" ] && [[ ! "$domain" =~ ^(docs|jsonld|owl|shacl)$ ]]; then
                TARGETS="$TARGETS $domain"
              fi
            done
            for file in $(echo "$CHANGED_FILES" | grep "^tests/data/"); do
              domain=$(echo "$file" | cut -d/ -f3)
              if [ -d "tests/data/$domain" ]; then
                TARGETS="$TARGETS $domain"
              fi
            done

            TARGETS=$(echo "$TARGETS" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)

            if [ -z "$TARGETS" ]; then
              echo "No relevant ontology domains changed."
              echo "should_run=false" >> $GITHUB_OUTPUT
            else
              echo "Targeting domains: $TARGETS"
              echo "domains=--domain $TARGETS" >> $GITHUB_OUTPUT
              echo "should_run=true" >> $GITHUB_OUTPUT
            fi
          fi

  # --- JOB 1: Standards & Syntax ---
  standards-and-syntax:
    name: Standards & Syntax
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run pre-commit
        run: |
          # Hooks like update-registry and update-properties may regenerate
          # files (e.g., registry.json includes a timestamp that changes per-run).
          # Run hooks, then verify only formatting/lint hooks produce no diff.
          just lint || true

          # Check if only auto-generated files changed (registry, properties, catalog)
          UNEXPECTED=$(git diff --name-only | grep -vE '(registry\.json|PROPERTIES\.md|properties\.md|catalog\.md|ontoenv\.toml|README\.md|context\.jsonld)' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Pre-commit hooks modified unexpected files:"
            echo "$UNEXPECTED"
            git diff -- $UNEXPECTED
            exit 1
          fi

  # --- JOB 1b: Generate Artifacts ---
  generate:
    name: Generate Artifacts
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Generate artifacts
        run: just generate
      - name: Normalize generated files (same as pre-commit hooks)
        run: uv run --frozen --group dev pre-commit run pretty-format-json --all-files || true
      - name: Verify no changes
        run: |
          CHANGES=$(git diff --name-only -- artifacts/)
          if [ -n "$CHANGES" ]; then
            echo "::error::just generate produced different artifacts than committed:"
            echo "$CHANGES"
            git diff -- artifacts/
            exit 1
          fi

  # --- JOB 2: SHACL Validation ---
  validate-shacl:
    name: SHACL Validation
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run SHACL Checks
        run: just validate --run check-data-conformance ${{ needs.changes.outputs.domains }}

  # --- JOB 3: OWL Consistency ---
  validate-owl:
    name: OWL Classes
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run Target Class Checks
        run: just validate --run check-artifact-coherence ${{ needs.changes.outputs.domains }}

  # --- JOB 4: Unit & Integration Tests ---
  unit-tests:
    name: Unit & Integration Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run validation suite
        run: just test
      # Until now nothing in CI ran pytest: this job's name promised unit tests but it
      # only invoked the validation suite. Assertions that need the pinned ASAM
      # submodules skip here (see the drift-guard job below) so the matrix stays cheap.
      - name: Run pytest suite
        run: just test-unit

  # --- JOB 4b: Pinned Standards Drift ---
  # Separate from the matrix on purpose: the ASAM standards submodule tree is ~260 MB,
  # so it is fetched once on ubuntu instead of six times across the matrix.
  # OMB_REQUIRE_PINNED_SOURCES turns the drift guard's "submodule missing" skip into a
  # hard failure, so the guard cannot silently stop running here.
  enum-drift:
    name: Pinned Standards Drift
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      OMB_REQUIRE_PINNED_SOURCES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Check out the pinned ASAM standards
        run: git submodule update --init --recursive --depth 1 submodules/asam-openx-standards
      - name: Check enumerations against their pinned sources
        run: just validate-enums
      # imports/opendrive and imports/openscenario are byte-for-byte copies of submodule
      # artifacts. Checked in this job because it is the one that already pays for the
      # ~260 MB submodule fetch. A submodule bump without a re-derive fails here.
      - name: Check the derived ASAM vocabularies against the submodule
        run: just asam-imports-check
      - name: Run the ASAM imports integration tests
        run: just test-asam-imports

  # --- JOB 5: Regression Tests ---
  regression-tests:
    name: Regression Tests
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run Failing Tests
        run: just validate --run check-failing-tests ${{ needs.changes.outputs.domains }}
