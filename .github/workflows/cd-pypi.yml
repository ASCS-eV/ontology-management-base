name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 🛠️ Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Verify package version matches the release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "pyproject version: $VERSION"
          echo "release tag:       $RELEASE_TAG"
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::pyproject version ($VERSION) does not match release tag ($RELEASE_TAG)."
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Reject direct-URL dependencies (PyPI forbids them)
        run: |
          python - <<'PY'
          import sys, zipfile, tarfile, glob
          from email.parser import Parser

          def bad_lines(meta_text):
              msg = Parser().parsestr(meta_text)
              out = []
              for req in msg.get_all("Requires-Dist") or []:
                  if "git+" in req or " @ " in req or "://" in req:
                      out.append(req)
              return out

          failures = []
          for whl in glob.glob("dist/*.whl"):
              with zipfile.ZipFile(whl) as z:
                  name = next(n for n in z.namelist() if n.endswith("METADATA"))
                  for r in bad_lines(z.read(name).decode()):
                      failures.append(f"{whl}: {r}")
          for sd in glob.glob("dist/*.tar.gz"):
              with tarfile.open(sd) as t:
                  name = next(n for n in t.getnames() if n.endswith("PKG-INFO"))
                  for r in bad_lines(t.extractfile(name).read().decode()):
                      failures.append(f"{sd}: {r}")

          if failures:
              print("::error::Direct-URL dependencies found in published metadata "
                    "(PyPI will reject the upload):")
              for f in failures:
                  print(f"  {f}")
              sys.exit(1)
          print("OK: no direct-URL dependencies in built distributions.")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: 🚀 Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ontology-management-base
    permissions:
      id-token: write  # OIDC token for trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
