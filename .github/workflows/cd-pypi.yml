name: Publish to PyPI

on:
  # NOTE: this workflow deliberately does *not* use a `release: [published]`
  # trigger. cd-release.yml creates the GitHub Release with GITHUB_TOKEN, and
  # GitHub does not start new workflow runs from GITHUB_TOKEN-created events
  # (recursion guard). That trigger therefore never fired, which is why every
  # publish up to v0.5.2 had to be dispatched by hand.
  #
  # The tag push is made by a human, so it *does* start workflows. Use it.
  push:
    tags:
      - 'v*.*.*'

  # Manual escape hatch: re-publish an existing tag, or publish a tag whose
  # push did not reach this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.5.2). Required when dispatching from a branch.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: 🛠️ Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Build from the tag being released, never from whatever a branch
          # happens to contain at dispatch time.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Verify package version matches the release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # This guard previously ran only for `release` events, i.e. never:
          # every real publish was a workflow_dispatch and went unchecked.
          # Resolve the expected tag for whichever path we are on.
          if [ -n "$INPUT_TAG" ]; then
            EXPECTED_TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            EXPECTED_TAG="$REF_NAME"
          else
            echo "::error::No release tag to verify against. Dispatch this workflow against the release tag, or set the 'tag' input."
            exit 1
          fi

          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "pyproject version: $VERSION"
          echo "expected tag:      $EXPECTED_TAG"
          if [ "v$VERSION" != "$EXPECTED_TAG" ]; then
            echo "::error::pyproject version ($VERSION) does not match release tag ($EXPECTED_TAG)."
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Reject direct-URL dependencies (PyPI forbids them)
        run: |
          python - <<'PY'
          import sys, zipfile, tarfile, glob
          from email.parser import Parser

          def bad_lines(meta_text):
              msg = Parser().parsestr(meta_text)
              out = []
              for req in msg.get_all("Requires-Dist") or []:
                  if "git+" in req or " @ " in req or "://" in req:
                      out.append(req)
              return out

          failures = []
          for whl in glob.glob("dist/*.whl"):
              with zipfile.ZipFile(whl) as z:
                  name = next(n for n in z.namelist() if n.endswith("METADATA"))
                  for r in bad_lines(z.read(name).decode()):
                      failures.append(f"{whl}: {r}")
          for sd in glob.glob("dist/*.tar.gz"):
              with tarfile.open(sd) as t:
                  name = next(n for n in t.getnames() if n.endswith("PKG-INFO"))
                  for r in bad_lines(t.extractfile(name).read().decode()):
                      failures.append(f"{sd}: {r}")

          if failures:
              print("::error::Direct-URL dependencies found in published metadata "
                    "(PyPI will reject the upload):")
              for f in failures:
                  print(f"  {f}")
              sys.exit(1)
          print("OK: no direct-URL dependencies in built distributions.")
          PY

      - name: Test the release wheel and sdist outside the checkout
        run: |
          python scripts/verify_wheel_install.py --wheel "dist/*.whl"
          python scripts/verify_wheel_install.py --sdist "dist/*.tar.gz" --publish
          python scripts/verify_wheel_install.py --wheel "dist/*.whl" --minimum

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: 🚀 Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ontology-management-base
    permissions:
      id-token: write  # OIDC token for trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
