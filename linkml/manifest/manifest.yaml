# LinkML source for the manifest ontology.
#
# Build and measure with:  just verify-linkml manifest
# What cannot be expressed, and the alternatives:  linkml/GAPS.md
#
# manifest is the base of the ENVITED-X ontology stack: it references no other
# domain, so it is the one ontology that can be ported without first porting
# something else. envited-x imports it; the leaf domains import envited-x.

id: https://w3id.org/ascs-ev/envited-x/manifest/v5
name: manifest
title: Ontology definition for manifest
description: >-
    An ontology with common classes to describe the structure as list of
    contents of a domain specific asset using a manifest.json e.g. in an
    archive.
license: https://www.eclipse.org/legal/epl-2.0/
source: https://github.com/ASCS-eV/ontology-management-base
see_also:
  - https://ascs-ev.github.io/EVES/

prefixes:
  linkml: https://w3id.org/linkml/
  manifest: https://w3id.org/ascs-ev/envited-x/manifest/v5/
  skos: http://www.w3.org/2004/02/skos/core#
  sh: http://www.w3.org/ns/shacl#
  owl: http://www.w3.org/2002/07/owl#
  dcterms: http://purl.org/dc/terms/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
default_prefix: manifest
default_range: string

# Literal-valued header terms; the IRI-valued ones (owl:versionIRI,
# owl:priorVersion, dcterms:identifier, dcterms:conformsTo,
# prov:wasDerivedFrom, dcterms:references) cannot be expressed at all -
# annotations are always literals. See linkml/GAPS.md D1.
annotations:
  owl:versionInfo: v5
  dcterms:creator: The GAIA-X 4 PLC AAD Project Team

imports:
  - linkml:types

classes:

  Manifest:
    class_uri: manifest:Manifest
    description: >-
      Defines the structure of an asset (e.g. simulation asset) as list of
      contents using a manifest.json, listing explicitely included artifacts,
      referenced artifacts and license information as linked properties.
      Typically used for archives.
    slots:
      - hasManifestReference
      - hasLicense
      - hasArtifacts
      - hasReferencedArtifacts
    slot_usage:
      hasManifestReference:
        required: true
        multivalued: false
      hasLicense:
        required: true
        multivalued: false
      hasArtifacts:
        required: true
        multivalued: true
      hasReferencedArtifacts:
        required: false
        multivalued: true

  Link:
    class_uri: manifest:Link
    description: >-
      Defines a Link instance that connects to data and mandatory metadata
      within an asset or related published simulation assets; can include web
      references.
    slots:
      - iri
      - note
      - shapesConformsTo
      - hasAccessRole
      - hasCategory
      - hasFileMetadata
    slot_usage:
      hasAccessRole:
        required: true
        multivalued: false
      hasCategory:
        required: true
        multivalued: false
      hasFileMetadata:
        required: true
        multivalued: false

  # A license link is a Link whose category is a license category. The
  # hand-written ontology states this as target-less SHACL shapes
  # (LicenseLinkReferenceShape, ManifestLinkReferenceShape); LinkML states it as
  # a subclass with a narrowed slot. No data change follows: hasLicense declares
  # rdfs:range manifest:LicenseLink, so RDFS inference types the node.
  LicenseLink:
    class_uri: manifest:LicenseLink
    is_a: Link
    description: A Link used for the license of a manifest.
    slot_usage:
      hasCategory:
        range: LicenseCategory
        required: true

  ManifestLink:
    class_uri: manifest:ManifestLink
    is_a: Link
    description: A Link used for the self-reference of a manifest.
    slot_usage:
      hasCategory:
        range: ManifestCategory
        required: true

  FileMetadata:
    class_uri: manifest:FileMetadata
    description: Represents the properties of a data file referenced within a Link instance.
    slots:
      - filePath
      - mimeType
      - cid
      - manifestFileSize
      - filename
      - timestamp
      - hasDimensions
    slot_usage:
      filePath:
        required: true
        multivalued: false
      mimeType:
        required: true
        multivalued: false
      hasDimensions:
        required: false
        multivalued: false

  Dimensions:
    class_uri: manifest:Dimensions
    description: >-
      General class for defining the dimensions of a data file, e.g., of type
      image or video, referenced inside a manifest:FileMetadata.
    slots:
      - unit
      - width
      - height
      - depth
    slot_usage:
      unit:
        required: true
        multivalued: false
      width:
        required: true
        multivalued: false
      height:
        required: true
        multivalued: false
      depth:
        required: false
        multivalued: false

  AccessRole:
    class_uri: manifest:AccessRole
    description: A class representing different access roles of artifacts in a manifest.

  Category:
    class_uri: manifest:Category
    description: A class representing different categories of artifacts in a manifest.

  LicenseCategory:
    class_uri: manifest:LicenseCategory
    is_a: Category

  ManifestCategory:
    class_uri: manifest:ManifestCategory
    is_a: Category

  MiscellaneousCategory:
    class_uri: manifest:MiscellaneousCategory
    is_a: Category

slots:

  hasLink:
    slot_uri: manifest:hasLink
    description: States that a subject has a Link instance.
    range: Link
    inlined: true

  hasManifestReference:
    slot_uri: manifest:hasManifestReference
    description: >-
      Links a Manifest to its corresponding manifest reference file, defining
      the structure and contents of a digital asset; only applicable within
      Manifest instances.
    range: ManifestLink
    inlined: true

  hasLicense:
    slot_uri: manifest:hasLicense
    description: >-
      Associates a Manifest instance with its corresponding license; only
      applicable within Manifest instances.
    range: LicenseLink
    inlined: true

  hasArtifacts:
    slot_uri: manifest:hasArtifacts
    description: >-
      Associates a Manifest instance with its artifacts, represented as Link
      instances; only applicable within Manifest instances.
    range: Link
    inlined: true

  hasReferencedArtifacts:
    slot_uri: manifest:hasReferencedArtifacts
    description: >-
      Associates a Manifest instance with its referenced artifacts, represented
      as Link instances; only applicable within Manifest instances.
    range: Link
    inlined: true

  hasFileMetadata:
    slot_uri: manifest:hasFileMetadata
    description: >-
      Associates a FileMetadata instance with its corresponding Link; only
      applicable within Link instances.
    range: FileMetadata
    inlined: true

  hasDimensions:
    slot_uri: manifest:hasDimensions
    description: >-
      Links a Dimensions instance to its associated FileMetadata, defining the
      size and scale of the data file; applicable only within FileMetadata
      instances.
    range: Dimensions
    inlined: true

  hasAccessRole:
    slot_uri: manifest:hasAccessRole
    description: General property to indicate the access role of an artifact.
    range: AccessRole

  hasCategory:
    slot_uri: manifest:hasCategory
    description: General property to indicate the category of an artifact.
    range: Category

  iri:
    slot_uri: manifest:iri
    description: IRI required if the file is RDF/JSON-LD.
    range: uri

  note:
    slot_uri: skos:note
    description: Additional information about the manifest reference.
    range: string

  # LinkML slot names are global across an import closure, and the Gaia-X
  # schemas that envited-x imports alongside manifest define their own
  # `conformsTo` (dcterms:conformsTo) and `fileSize` (gx:fileSize, a
  # MemorySize). The two slots below therefore need unique LinkML names.
  # `alias` keeps the JSON-LD term - and so every instance - unchanged, and
  # `slot_uri` (honoured under --no-use-native-uris) keeps the IRI unchanged.
  shapesConformsTo:
    alias: conformsTo
    slot_uri: sh:conformsTo
    description: Specifies ontology conformance.
    range: uri
    multivalued: true

  # MUST stay `string`, not `uri`. filePath holds relative paths such as
  # './visualization/foo.png'. With range `uri` gen-shacl forces
  # sh:nodeKind sh:IRI, the context has to coerce with "@type": "@id", and JSON-LD
  # then resolves the relative path against the document base - baking
  # 'file:///home/<user>/.../foo.png' into the RDF, different on every machine.
  # The hand-written shape says sh:datatype xsd:anyURI (a literal); `string` is
  # the closest LinkML can get, losing the datatype but preserving the value.
  # See linkml/GAPS.md D5.
  filePath:
    slot_uri: manifest:filePath
    description: >-
      A local or remote path/URL from which the file can be retrieved (e.g.
      './manifest_reference.json', 'ipfs://...', 's3://...', 'https://...').
    range: uri
    examples:
      - value: ./metadata/gxMetadata.json

  mimeType:
    slot_uri: manifest:mimeType
    description: Defines the MIME type of the file.
    range: string
    pattern: "^(application|audio|font|example|image|message|model|multipart|text|video)/[a-zA-Z0-9!#$&^_.+-]+$|^x-[a-zA-Z0-9!#$&^_.+-]+/[a-zA-Z0-9!#$&^_.+-]+$"
    examples:
      - value: application/pdf

  cid:
    slot_uri: manifest:cid
    description: Defines the IPFS CIDv1 identifier of the file.
    range: string
    pattern: "^((?!Qm[1-9A-HJ-NP-Za-km-z]{44,})|b[A-Za-z2-7]{58,}|B[A-Z2-7]{58,}|z[1-9A-HJ-NP-Za-km-z]{48,}|F[0-9A-F]{50,})$"
    examples:
      - value: bafkreic6xmosvgr4a5735itquknu2ljf4fon7wohrzlmabepwkkxtih6um

  # See the note on shapesConformsTo above.
  manifestFileSize:
    alias: fileSize
    slot_uri: manifest:fileSize
    description: Specifies the file size in bytes.
    range: integer
    examples:
      - value: "1048576"

  filename:
    slot_uri: manifest:filename
    description: Specifies the file name (excluding the path) along with its extension.
    range: string
    pattern: "^([\\w,\\s-]+(?:\\.[\\w,\\s-]+)*)\\.([A-Za-z0-9]+)$"
    examples:
      - value: example.txt

  timestamp:
    slot_uri: manifest:timestamp
    description: >-
      Represents a date or time associated with the file, such as recording
      time or creation time.
    range: datetime
    examples:
      - value: "2022-04-01T00:00:00"

  unit:
    slot_uri: manifest:unit
    description: Specifies the unit of measurement (e.g., metres, inches).
    range: UnitEnum
    examples:
      - value: metres

  # sh:minExclusive "0.0" cannot be expressed: LinkML has only minimum_value,
  # which generates sh:minInclusive. Leaving the bound off entirely is more
  # honest than silently admitting zero. See linkml/GAPS.md D6.
  width:
    slot_uri: manifest:width
    description: Specifies the width (x-axis) of the item in appropriate units.
    range: float
    examples:
      - value: "1920.0"

  height:
    slot_uri: manifest:height
    description: Specifies the height (y-axis) of the item in appropriate units.
    range: float
    examples:
      - value: "1080.0"

  depth:
    slot_uri: manifest:depth
    description: Specifies the depth (z-axis) of the item in appropriate units.
    range: float
    examples:
      - value: "0.0"

enums:
  UnitEnum:
    permissible_values:
      metres:
      inches:
      pixels:
