# LinkML source for the manifest ontology.
#
# Build with:  just generate   (artifacts/manifest/ is generated from this file)
# What cannot be expressed, and the alternatives:  linkml/GAPS.md
#
# manifest is the base of the ENVITED-X ontology stack: it references no other
# domain. envited-x imports it; the leaf domains import envited-x.
#
# The SHACL is generated with --inlined-as-node: a value written inline (a link,
# its file metadata, its dimensions) is checked against its range class's shape,
# whatever type it states, and a reference to a named individual (an access role,
# a category) is checked by its type. Access roles and categories therefore carry
# an identifier: they are referenced, never inlined.

id: https://w3id.org/ascs-ev/envited-x/manifest/v6
name: manifest
title: Ontology definition for manifest
description: >-
    An ontology with common classes to describe the structure as list of
    contents of a domain specific asset using a manifest.json e.g. in an
    archive.
license: https://www.eclipse.org/legal/epl-2.0/
source: https://github.com/ASCS-eV/ontology-management-base
conforms_to: https://w3id.org/ascs-ev/envited-x/manifest/v6/shapes
contributors:
  - https://github.com/jtdemer
  - https://github.com/jdsika
  - https://github.com/MircoNierenz
  - https://github.com/konierik
see_also:
  - https://ascs-ev.github.io/EVES/

prefixes:
  linkml: https://w3id.org/linkml/
  manifest: https://w3id.org/ascs-ev/envited-x/manifest/v6/
  skos: http://www.w3.org/2004/02/skos/core#
  sh: http://www.w3.org/ns/shacl#
  owl: http://www.w3.org/2002/07/owl#
  xsd: http://www.w3.org/2001/XMLSchema#
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
default_prefix: manifest
default_range: string

# owl:versionIRI, owl:priorVersion, prov:wasDerivedFrom, dcterms:references and
# dcterms:publisher take resources, so their values are emitted as IRIs.
# dcterms:identifier is a literal by its DCMI range. Contributors are named by
# their GitHub accounts: see linkml/GAPS.md G16.
annotations:
  owl:versionInfo: v6
  owl:versionIRI: https://w3id.org/ascs-ev/envited-x/manifest/v6
  owl:priorVersion: https://w3id.org/ascs-ev/envited-x/manifest/v5
  prov:wasDerivedFrom: https://github.com/ASCS-eV/ontology-management-base/releases/tag/v0.6.0
  dcterms:identifier: https://w3id.org/ascs-ev/envited-x/manifest
  dcterms:references: https://w3id.org/ascs-ev/envited-x/envited-x/
  dcterms:creator: The GAIA-X 4 PLC AAD Project Team
  dcterms:publisher: https://www.asc-s.de/

imports:
  - linkml:types

types:

  # A URI reference held as data - a file location such as
  # './visualization/foo.png', 'ipfs://...' or 'https://...' - not a link to a
  # resource. Derived from string, it stays an xsd:anyURI literal in every
  # artifact: as an IRI node, JSON-LD would resolve a relative path against the
  # document base and bake a machine-specific absolute IRI into the RDF.
  UriReference:
    typeof: string
    uri: xsd:anyURI
    description: >-
      An absolute or relative URI reference (RFC 3986), kept as an xsd:anyURI
      literal.

classes:

  Manifest:
    class_uri: manifest:Manifest
    description: >-
      Defines the structure of an asset (e.g. simulation asset) as list of
      contents using a manifest.json, listing explicitely included artifacts,
      referenced artifacts and license information as linked properties.
      Typically used for archives.
    slots:
      - hasManifestReference
      - hasLicense
      - hasArtifacts
      - hasReferencedArtifacts
    slot_usage:
      hasManifestReference:
        required: true
        multivalued: false
      hasLicense:
        required: true
        multivalued: false
      hasArtifacts:
        required: true
        multivalued: true
      hasReferencedArtifacts:
        required: false
        multivalued: true

  Link:
    class_uri: manifest:Link
    description: >-
      Defines a Link instance that connects to data and mandatory metadata
      within an asset or related published simulation assets; can include web
      references.
    slots:
      - iri
      - note
      - shapesConformsTo
      - hasAccessRole
      - hasCategory
      - hasFileMetadata
    slot_usage:
      hasAccessRole:
        required: true
        multivalued: false
      hasCategory:
        required: true
        multivalued: false
      hasFileMetadata:
        required: true
        multivalued: false

  # Every link of a manifest except its self-reference is an artifact link. An
  # artifact link to an RDF/JSON-LD document identifies the resource, says what
  # it is and the ontology it conforms to. The self-reference is the manifest
  # file itself, so it is a ManifestLink, which is not an artifact link.
  ArtifactLink:
    class_uri: manifest:ArtifactLink
    is_a: Link
    description: >-
      A Link to an artifact of a manifest: its content, license or a referenced
      artifact.
    rules:
      - description: A JSON-LD artifact needs an IRI.
        preconditions:
          slot_conditions:
            hasFileMetadata:
              range_expression:
                slot_conditions:
                  mimeType: {equals_string: application/ld+json}
        postconditions:
          slot_conditions:
            iri: {required: true}
      - description: A JSON-LD artifact needs a skos:note.
        preconditions:
          slot_conditions:
            hasFileMetadata:
              range_expression:
                slot_conditions:
                  mimeType: {equals_string: application/ld+json}
        postconditions:
          slot_conditions:
            note: {required: true}
      - description: A JSON-LD artifact needs its ontology conformance.
        preconditions:
          slot_conditions:
            hasFileMetadata:
              range_expression:
                slot_conditions:
                  mimeType: {equals_string: application/ld+json}
        postconditions:
          slot_conditions:
            shapesConformsTo: {required: true}

  # A license link is an artifact link whose category is a license category.
  # hasLicense declares it as its range.
  LicenseLink:
    class_uri: manifest:LicenseLink
    is_a: ArtifactLink
    description: A Link used for the license of a manifest.
    slot_usage:
      hasCategory:
        range: LicenseCategory
        required: true

  ManifestLink:
    class_uri: manifest:ManifestLink
    is_a: Link
    description: A Link used for the self-reference of a manifest.
    slot_usage:
      hasCategory:
        range: ManifestCategory
        required: true

  FileMetadata:
    class_uri: manifest:FileMetadata
    description: Represents the properties of a data file referenced within a Link instance.
    slots:
      - filePath
      - mimeType
      - cid
      - manifestFileSize
      - filename
      - timestamp
      - hasDimensions
    slot_usage:
      filePath:
        required: true
        multivalued: false
      mimeType:
        required: true
        multivalued: false
      hasDimensions:
        required: false
        multivalued: false

  Dimensions:
    class_uri: manifest:Dimensions
    description: >-
      General class for defining the dimensions of a data file, e.g., of type
      image or video, referenced inside a manifest:FileMetadata.
    slots:
      - unit
      - width
      - height
      - depth
    slot_usage:
      unit:
        required: true
        multivalued: false
      width:
        required: true
        multivalued: false
      height:
        required: true
        multivalued: false
      depth:
        required: false
        multivalued: false

  # Access roles and categories are open vocabularies: a domain contributes its
  # own named individuals (envited-x does). Each is a referenced individual, so
  # the classes carry an identifier.
  AccessRole:
    class_uri: manifest:AccessRole
    description: A class representing different access roles of artifacts in a manifest.
    slots: [id]

  Category:
    class_uri: manifest:Category
    description: A class representing different categories of artifacts in a manifest.
    slots: [id]

  LicenseCategory:
    class_uri: manifest:LicenseCategory
    is_a: Category

  ManifestCategory:
    class_uri: manifest:ManifestCategory
    is_a: Category

  MiscellaneousCategory:
    class_uri: manifest:MiscellaneousCategory
    is_a: Category

slots:

  id:
    identifier: true
    range: uriorcurie
    description: The IRI of a named individual.

  hasLink:
    slot_uri: manifest:hasLink
    description: States that a subject has a Link instance.
    range: Link
    inlined: true

  hasManifestReference:
    slot_uri: manifest:hasManifestReference
    is_a: hasLink
    description: >-
      Links a Manifest to its corresponding manifest reference file, defining
      the structure and contents of a digital asset; only applicable within
      Manifest instances.
    range: ManifestLink
    inlined: true

  hasLicense:
    slot_uri: manifest:hasLicense
    description: >-
      Associates a Manifest instance with its corresponding license; only
      applicable within Manifest instances.
    range: LicenseLink
    inlined: true

  hasArtifacts:
    slot_uri: manifest:hasArtifacts
    is_a: hasLink
    description: >-
      Associates a Manifest instance with its artifacts, represented as Link
      instances; only applicable within Manifest instances.
    range: ArtifactLink
    inlined: true

  hasReferencedArtifacts:
    slot_uri: manifest:hasReferencedArtifacts
    is_a: hasLink
    description: >-
      Associates a Manifest instance with its referenced artifacts, represented
      as Link instances; only applicable within Manifest instances.
    range: ArtifactLink
    inlined: true

  hasFileMetadata:
    slot_uri: manifest:hasFileMetadata
    description: >-
      Associates a FileMetadata instance with its corresponding Link; only
      applicable within Link instances.
    range: FileMetadata
    inlined: true

  hasDimensions:
    slot_uri: manifest:hasDimensions
    description: >-
      Links a Dimensions instance to its associated FileMetadata, defining the
      size and scale of the data file; applicable only within FileMetadata
      instances.
    range: Dimensions
    inlined: true

  hasAccessRole:
    slot_uri: manifest:hasAccessRole
    description: General property to indicate the access role of an artifact.
    range: AccessRole

  hasCategory:
    slot_uri: manifest:hasCategory
    description: General property to indicate the category of an artifact.
    range: Category

  iri:
    slot_uri: manifest:iri
    description: IRI required if the file is RDF/JSON-LD.
    range: uri

  note:
    slot_uri: skos:note
    description: Additional information about the linked artifact.
    range: string

  # LinkML slot names are global across an import closure, and the Gaia-X
  # schemas that envited-x imports alongside manifest define their own
  # `conformsTo` (dcterms:conformsTo) and `fileSize` (gx:fileSize, a
  # MemorySize). The two slots below therefore need unique LinkML names.
  # `alias` keeps the JSON-LD term - and so every instance - unchanged, and
  # `slot_uri` (honoured under --no-use-native-uris) keeps the IRI unchanged.
  shapesConformsTo:
    alias: conformsTo
    slot_uri: sh:conformsTo
    description: Specifies ontology conformance.
    range: uri
    multivalued: true

  filePath:
    slot_uri: manifest:filePath
    description: >-
      A local or remote path/URL from which the file can be retrieved (e.g.
      './manifest_reference.json', 'ipfs://...', 's3://...', 'https://...').
    range: UriReference
    examples:
      - value: ./metadata/gxMetadata.json

  mimeType:
    slot_uri: manifest:mimeType
    description: Defines the MIME type of the file.
    range: string
    pattern: "^(application|audio|font|example|image|message|model|multipart|text|video)/[a-zA-Z0-9!#$&^_.+-]+$|^x-[a-zA-Z0-9!#$&^_.+-]+/[a-zA-Z0-9!#$&^_.+-]+$"
    examples:
      - value: application/pdf

  # A CIDv1 in one of its multibase encodings: base32 (b / B), base58btc (z) or
  # base16 (F). A CIDv0 ('Qm...') matches none of them.
  cid:
    slot_uri: manifest:cid
    description: Defines the IPFS CIDv1 identifier of the file.
    range: string
    pattern: "^(b[A-Za-z2-7]{58,}|B[A-Z2-7]{58,}|z[1-9A-HJ-NP-Za-km-z]{48,}|F[0-9A-F]{50,})$"
    examples:
      - value: bafkreic6xmosvgr4a5735itquknu2ljf4fon7wohrzlmabepwkkxtih6um

  # See the note on shapesConformsTo above.
  manifestFileSize:
    alias: fileSize
    slot_uri: manifest:fileSize
    description: Specifies the file size in bytes.
    range: integer
    examples:
      - value: "1048576"

  filename:
    slot_uri: manifest:filename
    description: Specifies the file name (excluding the path) along with its extension.
    range: string
    pattern: "^([\\w,\\s-]+(?:\\.[\\w,\\s-]+)*)\\.([A-Za-z0-9]+)$"
    examples:
      - value: example.txt

  timestamp:
    slot_uri: manifest:timestamp
    description: >-
      Represents a date or time associated with the file, such as recording
      time or creation time.
    range: datetime
    examples:
      - value: "2022-04-01T00:00:00"

  unit:
    slot_uri: manifest:unit
    description: Specifies the unit of measurement (e.g., metres, inches).
    range: UnitEnum
    examples:
      - value: metres

  # The dimensions are positive numbers. The metamodel has no exclusive bound
  # (minimum_value is inclusive), so "greater than 0" cannot be stated; see
  # linkml/GAPS.md G8.
  width:
    slot_uri: manifest:width
    description: Specifies the width (x-axis) of the item in appropriate units.
    range: float
    examples:
      - value: "1920.0"

  height:
    slot_uri: manifest:height
    description: Specifies the height (y-axis) of the item in appropriate units.
    range: float
    examples:
      - value: "1080.0"

  depth:
    slot_uri: manifest:depth
    description: Specifies the depth (z-axis) of the item in appropriate units.
    range: float
    examples:
      - value: "0.5"

enums:

  UnitEnum:
    permissible_values:
      metres:
      inches:
      pixels:

  # The named individuals manifest defines for its own vocabularies. The enums
  # close only their own classes; AccessRole and Category stay open for the
  # individuals other domains add.
  ManifestAccessRoleEnum:
    implements: [owl:NamedIndividual]
    description: The access roles manifest defines.
    permissible_values:
      isPublic:
        meaning: manifest:isPublic
        instantiates: [manifest:AccessRole]
        title: Public Access Role
        description: Indicates that the artifact access role is public.

  ManifestCategoryEnum:
    implements: [owl:NamedIndividual]
    description: The artifact categories manifest defines.
    permissible_values:
      isLicense:
        meaning: manifest:isLicense
        instantiates: [manifest:LicenseCategory]
        title: License Category
        description: Indicates that the artifact category is a license.
      isManifest:
        meaning: manifest:isManifest
        instantiates: [manifest:ManifestCategory]
        title: Manifest Category
        description: Indicates that the artifact category is a manifest.
      isMiscellaneous:
        meaning: manifest:isMiscellaneous
        instantiates: [manifest:MiscellaneousCategory]
        title: Miscellaneous Category
        description: Indicates that the artifact category is miscellaneous.
