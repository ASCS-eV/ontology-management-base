enums:

  # ---------------------------------------------------------------------------
  # Behaviour Signalling (BSI Flex 1891, 5.2)
  # ---------------------------------------------------------------------------
  BehaviourSignallingEnum:
    description: Types of signalling behaviour.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.2"
    notes:
      - "Replaces BehaviourCommunicationEnum. Former values map as: CommunicationHorn, CommunicationHeadlightFlash, CommunicationSignalHazard → ExternalWarningSignalling; CommunicationSignalLeft, CommunicationSignalRight, CommunicationSignalSlowing, CommunicationWave → ExternalIntentSignalling; CommunicationSignalEmergency → ExternalEmergencySignalling."
    permissible_values:
      ExternalSignalling:
        description: External signalling; indicates the actor's state or intent to other actors in its vicinity.
        comments:
          - "BSI Flex 1891 v1.0:2025-01, 5.2.2"
        meaning: openlabel_v2:ExternalSignalling
      ExternalWarningSignalling:
        description: External warning signalling (e.g. hazard lights, horn).
        comments:
          - "BSI Flex 1891 v1.0:2025-01, 5.2.2 a)"
        meaning: openlabel_v2:ExternalWarningSignalling
      ExternalIntentSignalling:
        description: External intent signalling (e.g. turning indicators, turn-hand gestures).
        comments:
          - "BSI Flex 1891 v1.0:2025-01, 5.2.2 b)"
        meaning: openlabel_v2:ExternalIntentSignalling
      ExternalEmergencySignalling:
        description: External emergency signalling (e.g. police or ambulance sirens, police officer's gestures).
        comments:
          - "BSI Flex 1891 v1.0:2025-01, 5.2.2 c)"
        meaning: openlabel_v2:ExternalEmergencySignalling
      InternalSignalling:
        description: Internal signalling; indicates the vehicle's state or intent to its occupants.
        comments:
          - "BSI Flex 1891 v1.0:2025-01, 5.2.3"
        meaning: openlabel_v2:InternalSignalling
      InternalWarningSignalling:
        description: Internal warning signalling (e.g. low tyre pressure, engine warning light).
        comments:
          - "BSI Flex 1891 v1.0:2025-01, 5.2.3 a)"
        meaning: openlabel_v2:InternalWarningSignalling
      InternalIntentSignalling:
        description: Internal intent signalling (e.g. turning indicators, HMI message for no-user-in-charge vehicles).
        comments:
          - "BSI Flex 1891 v1.0:2025-01, 5.2.3 b)"
        meaning: openlabel_v2:InternalIntentSignalling
      InternalEmergencySignalling:
        description: Internal emergency signalling (e.g. forward collision warning, handover request).
        comments:
          - "BSI Flex 1891 v1.0:2025-01, 5.2.3 c)"
        meaning: openlabel_v2:InternalEmergencySignalling

