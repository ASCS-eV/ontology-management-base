  # ---------------------------------------------------------------------------
  # Behaviour Communication
  # ---------------------------------------------------------------------------
  BehaviourCommunicationEnum:
    description: Types of communication behaviours by road users.
    comments:
      - "ASAM OpenLABEL V1.0.0"
    notes:
      - "Communication signals are not covered by ISO 34504 action tags. These are ASAM OpenLABEL-specific extensions for scenario description fidelity."
    permissible_values:
      CommunicationHeadlightFlash:
        description: Flash headlight.
        meaning: openlabel_v2:CommunicationHeadlightFlash
      CommunicationHorn:
        description: Sound horn.
        meaning: openlabel_v2:CommunicationHorn
      CommunicationSignalEmergency:
        description: Signal emergency.
        meaning: openlabel_v2:CommunicationSignalEmergency
      CommunicationSignalHazard:
        description: Signal hazard.
        meaning: openlabel_v2:CommunicationSignalHazard
      CommunicationSignalLeft:
        description: Signal left.
        meaning: openlabel_v2:CommunicationSignalLeft
      CommunicationSignalRight:
        description: Signal right.
        meaning: openlabel_v2:CommunicationSignalRight
      CommunicationSignalSlowing:
        description: Signal slowing.
        meaning: openlabel_v2:CommunicationSignalSlowing
      CommunicationWave:
        description: Wave.
        meaning: openlabel_v2:CommunicationWave

