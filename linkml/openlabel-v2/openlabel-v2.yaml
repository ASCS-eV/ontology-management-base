          If weatherWindValue is provided, WeatherWind must be true.
        preconditions:
          slot_conditions:
            weatherWindValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            WeatherWind:
              equals_string: "true"
      - description: >-
          If weatherRainValue is provided, WeatherRain must be true.
        preconditions:
          slot_conditions:
            weatherRainValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            WeatherRain:
              equals_string: "true"
      - description: >-
          If weatherSnowValue is provided, WeatherSnow must be true.
        preconditions:
