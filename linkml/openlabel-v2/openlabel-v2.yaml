            LaneSpecificationLaneCount:
              equals_string: "true"
      - description: >-
          If horizontalCurvesValue is provided, HorizontalCurves must be true.
        preconditions:
          slot_conditions:
            horizontalCurvesValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            HorizontalCurves:
              equals_string: "true"
      - description: >-
          If longitudinalDownSlopeValue is provided, LongitudinalDownSlope must be true.
        preconditions:
          slot_conditions:
            longitudinalDownSlopeValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            LongitudinalDownSlope:
              equals_string: "true"
      - description: >-
          If longitudinalUpSlopeValue is provided, LongitudinalUpSlope must be true.
        preconditions:
          slot_conditions:
            longitudinalUpSlopeValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            LongitudinalUpSlope:
              equals_string: "true"
      - description: >-
          If subjectVehicleSpeedValue is provided, SubjectVehicleSpeed must be true.
        preconditions:
          slot_conditions:
            subjectVehicleSpeedValue:
              value_presence: PRESENT
        postconditions:
