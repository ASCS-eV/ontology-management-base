            TrafficFlowRate:
              equals_string: "true"
      - description: >-
          If trafficVolumeValue is provided, TrafficVolume must be true.
        preconditions:
          slot_conditions:
            trafficVolumeValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            TrafficVolume:
              equals_string: "true"
      - description: >-
          If laneSpecificationDimensionsValue is provided, LaneSpecificationDimensions must be true.
        preconditions:
          slot_conditions:
            laneSpecificationDimensionsValue:
              value_presence: PRESENT
        postconditions:
