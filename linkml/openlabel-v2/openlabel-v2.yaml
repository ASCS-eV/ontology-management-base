# =============================================================================
# Slots (properties)
# =============================================================================
slots:

  # ---------------------------------------------------------------------------
  # Scenario slots
  # ---------------------------------------------------------------------------
  hasTag:
    description: A tag associated with a scenario.
    slot_uri: openlabel_v2:hasTag
    range: Tag

  # ---------------------------------------------------------------------------
  # Tag composition slots (references to sub-shapes)
  # ---------------------------------------------------------------------------
  AdminTag:
    description: Administration tag.
    slot_uri: openlabel_v2:AdminTag
    range: AdminTag
    inlined: true

  Behaviour:
    description: Behaviour tag.
    slot_uri: openlabel_v2:Behaviour
    range: Behaviour
    inlined: true

  Odd:
    description: Operational Design Domain tag.
    slot_uri: openlabel_v2:Odd
    range: Odd
    inlined: true

  # ---------------------------------------------------------------------------
  # AdminTag slots (all rdfs:Literal in v1)
  # ---------------------------------------------------------------------------
  licenseURI:
    description: The type of license which governs usage of the scenario.
    slot_uri: openlabel_v2:licenseURI
    range: string

  ownerEmail:
    description: The email address of the legal entity who owns the rights to the scenario.
    slot_uri: openlabel_v2:ownerEmail
    range: string

  ownerName:
    description: The name of the legal entity who owns the rights to the scenario.
    slot_uri: openlabel_v2:ownerName
    range: string

  ownerURL:
    description: The URL of the legal entity who owns the rights to the scenario.
    slot_uri: openlabel_v2:ownerURL
    range: string

  scenarioCreatedDate:
    description: The date that the scenario was created/published.
    slot_uri: openlabel_v2:scenarioCreatedDate
    range: datetime

  scenarioDefinition:
    description: SDL definition of the scenario.
    slot_uri: openlabel_v2:scenarioDefinition
    range: string

  scenarioDefinitionLanguageURI:
    description: URI of SDL language used for the definition of the scenario.
    slot_uri: openlabel_v2:scenarioDefinitionLanguageURI
    range: string

  scenarioDescription:
    description: A description of the scenario.
    slot_uri: openlabel_v2:scenarioDescription
    range: string

  scenarioName:
    description: The name of the scenario.
    slot_uri: openlabel_v2:scenarioName
    range: string

  scenarioParentReference:
    description: >-
      Universally unique identifier (UUID) which identifies the scenario
      which this one has been derived from.
    slot_uri: openlabel_v2:scenarioParentReference
    range: string

  scenarioUniqueReference:
    description: >-
      Universally unique identifier (UUID) assigned to the scenario which
      allows the scenario to be identified.
    slot_uri: openlabel_v2:scenarioUniqueReference
    range: string

  scenarioVersion:
    description: The version number of the scenario.
    slot_uri: openlabel_v2:scenarioVersion
    range: string

  scenarioVisualisationURL:
    description: >-
      Relative or absolute URL of a static image or animation of the scenario
      to allow users to easily see what the scenario represents.
    slot_uri: openlabel_v2:scenarioVisualisationURL
    range: string

  # ---------------------------------------------------------------------------
  # Behaviour enum slots (BSI Flex 1891, 5.2 and 5.3)
  # ---------------------------------------------------------------------------
  BehaviourSignalling:
    description: Signalling behaviour indicating the current or future intent of an actor.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.2"
    aliases:
      - "Signalling"
    notes:
      - "Replaces the ASAM OpenLABEL BehaviourCommunication slot."
    slot_uri: openlabel_v2:BehaviourSignalling
    range: BehaviourSignallingEnum
    multivalued: true

  BehaviourPositioning:
    description: Positioning of the subject vehicle before or after the execution of a manoeuvre.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.3"
    aliases:
      - "Positioning"
    slot_uri: openlabel_v2:BehaviourPositioning
    range: BehaviourPositioningEnum
    multivalued: true

  # ---------------------------------------------------------------------------
  # Manoeuvre flags — vehicle absolute tactical manoeuvres (BSI Flex 1891, 5.4.2.2)
  # ---------------------------------------------------------------------------
  MotionDrive:
    description: Drive in-lane; the vehicle remains in its lane (physically demarcated or virtual lanes).
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.2.2"
    aliases:
      - "Drive in-lane"
    slot_uri: openlabel_v2:MotionDrive
    range: boolean

  MotionTurnRight:
    description: Turn right; the vehicle's trajectory changes its forward direction toward the right where the road layout allows a turn.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.2.3"
    aliases:
      - "Turn right"
    slot_uri: openlabel_v2:MotionTurnRight
    range: boolean

  MotionTurnLeft:
    description: Turn left; the vehicle's trajectory changes its forward direction toward the left where the road layout allows a turn.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.2.4"
    aliases:
      - "Turn left"
    slot_uri: openlabel_v2:MotionTurnLeft
    range: boolean

  MotionLaneChange:
    description: Lane change; the vehicle moves from its current lane of travel to an adjacent lane.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.2.5"
    aliases:
      - "Lane change"
    slot_uri: openlabel_v2:MotionLaneChange
    range: boolean

  MotionLaneChangeLeft:
    description: Lane change to the left.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.2.5 NOTE 2"
    notes:
      - "Not in the internal ontology; kept because BSI Flex 1891, 5.4.2.2.5 NOTE 2 allows lane change to be further classified into left and right."
    slot_uri: openlabel_v2:MotionLaneChangeLeft
    range: boolean

  MotionLaneChangeRight:
    description: Lane change to the right.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.2.5 NOTE 2"
    notes:
      - "Not in the internal ontology; kept because BSI Flex 1891, 5.4.2.2.5 NOTE 2 allows lane change to be further classified into left and right."
    slot_uri: openlabel_v2:MotionLaneChangeRight
    range: boolean

  MotionReverse:
    description: Reverse; the vehicle moves in the reverse or opposite direction.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.2.6"
    aliases:
      - "Reverse"
    slot_uri: openlabel_v2:MotionReverse
    range: boolean

  MotionStop:
    description: Stop position; the vehicle reaches zero velocity and maintains its position.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.2.7"
    aliases:
      - "Stop position"
    slot_uri: openlabel_v2:MotionStop
    range: boolean

  MotionUTurn:
    description: Turnabout; the vehicle changes its direction of travel by 180 degrees (e.g. U-turn, three-point turn).
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.2.8"
    aliases:
      - "Turnabout"
    slot_uri: openlabel_v2:MotionUTurn
    range: boolean

  MotionParkingManoeuvre:
    description: Parking manoeuvre; the vehicle moves into a demarcated or non-demarcated parking area, ending stopped.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.2.9"
    aliases:
      - "Parking manoeuvre"
    slot_uri: openlabel_v2:MotionParkingManoeuvre
    range: boolean

  # ---------------------------------------------------------------------------
  # Manoeuvre flags — vehicle absolute operational manoeuvres (BSI Flex 1891, 5.4.2.3)
  # ---------------------------------------------------------------------------
  MotionAccelerate:
    description: Accelerate; the vehicle's velocity gradient is positive.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.3.2"
    aliases:
      - "Accelerate"
    slot_uri: openlabel_v2:MotionAccelerate
    range: boolean

  MotionAccelerateEgo:
    description: Acceleration of the ego (subject) vehicle.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.3.2"
    notes:
      - "Internal ontology extension: acceleration is distinguished for the ego vehicle and for traffic agents."
    slot_uri: openlabel_v2:MotionAccelerateEgo
    range: boolean

  MotionAccelerateTrafficAgent:
    description: Acceleration of a traffic agent.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.3.2"
    notes:
      - "Internal ontology extension: acceleration is distinguished for the ego vehicle and for traffic agents."
    slot_uri: openlabel_v2:MotionAccelerateTrafficAgent
    range: boolean

  MotionDecelerate:
    description: Decelerate; the vehicle's velocity gradient is negative.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.3.3"
    aliases:
      - "Decelerate"
    slot_uri: openlabel_v2:MotionDecelerate
    range: boolean

  # ---------------------------------------------------------------------------
  # Manoeuvre flags — non-vehicle absolute tactical manoeuvres (BSI Flex 1891, 5.4.2.4.2)
  # ---------------------------------------------------------------------------
  MotionNonVehicleTurnRight:
    description: Turn right by a non-vehicle actor (e.g. pedestrian, animal).
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.4.2 a)"
    aliases:
      - "Turn right (non-vehicle)"
    slot_uri: openlabel_v2:MotionNonVehicleTurnRight
    range: boolean

  MotionNonVehicleTurnLeft:
    description: Turn left by a non-vehicle actor (e.g. pedestrian, animal).
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.4.2 b)"
    aliases:
      - "Turn left (non-vehicle)"
    slot_uri: openlabel_v2:MotionNonVehicleTurnLeft
    range: boolean

  MotionCross:
    description: Cross the road at a demarcated or non-demarcated point (non-vehicle actor).
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.4.2 c)"
    aliases:
      - "Cross (non-vehicle)"
    slot_uri: openlabel_v2:MotionCross
    range: boolean

  MotionNonVehicleWait:
    description: Wait (non-vehicle actor).
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.4.2 d)"
    aliases:
      - "Wait"
    slot_uri: openlabel_v2:MotionNonVehicleWait
    range: boolean

  # ---------------------------------------------------------------------------
  # Manoeuvre flags — non-vehicle absolute operational manoeuvres (BSI Flex 1891, 5.4.2.4.3)
  # ---------------------------------------------------------------------------
  MotionWalk:
    description: Walk or slow speed (under 4 km/h).
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.4.3 a)"
    aliases:
      - "Walk"
    slot_uri: openlabel_v2:MotionWalk
    range: boolean

  MotionNonVehicleJog:
    description: Jog or moderate speed (over 4 km/h but under 6 km/h).
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.4.3 b)"
    aliases:
      - "Jog"
    slot_uri: openlabel_v2:MotionNonVehicleJog
    range: boolean

  MotionRun:
    description: Run or fast speed (over 6 km/h).
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.4.3 c)"
    aliases:
      - "Run"
    slot_uri: openlabel_v2:MotionRun
    range: boolean

  MotionSlide:
    description: Slide; unintentional movement such as tripping, falling or skidding.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.4.3 d)"
    aliases:
      - "Slide"
    slot_uri: openlabel_v2:MotionSlide
    range: boolean

  # ---------------------------------------------------------------------------
  # Manoeuvre flags — relative manoeuvres (BSI Flex 1891, 5.4.3)
  # ---------------------------------------------------------------------------
  MotionOvertake:
    description: Overtake; the subject vehicle moves from behind to in front of another actor in the same lane.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.3.2"
    aliases:
      - "Overtake"
    slot_uri: openlabel_v2:MotionOvertake
    range: boolean

  MotionCutIn:
    description: Cut-in; the subject vehicle moves in front of another actor by a lane change.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.3.3"
    aliases:
      - "Cut-in"
    slot_uri: openlabel_v2:MotionCutIn
    range: boolean

  MotionCutOut:
    description: Cut-out; the subject vehicle changes lane to move away from an actor it is in front of.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.3.4"
    aliases:
      - "Cut-out"
    slot_uri: openlabel_v2:MotionCutOut
    range: boolean

  MotionCutAcross:
    description: Cut across; the subject vehicle's trajectory is perpendicular to another actor's trajectory.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.3.5"
    aliases:
      - "Cut across"
    slot_uri: openlabel_v2:MotionCutAcross
    range: boolean

  MotionYield:
    description: Yield; the subject vehicle stops and waits in reaction to another actor or road feature.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.3.6"
    aliases:
      - "Yield"
    slot_uri: openlabel_v2:MotionYield
    range: boolean

  MotionPass:
    description: Pass; the subject vehicle moves in front of another actor in an adjacent lane.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.3.7"
    aliases:
      - "Pass"
    slot_uri: openlabel_v2:MotionPass
    range: boolean

  # ---------------------------------------------------------------------------
  # Behaviour value slots (decimal measurements)
  # ---------------------------------------------------------------------------
  motionAccelerateEgoValue:
    description: Rate of acceleration of the ego vehicle (m/s²).
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.3.2"
    aliases:
      - "Rate of acceleration (ms-2)"
    notes:
      - "Quantification of the manoeuvre is an extension of the internal ontology; BSI Flex 1891 defines the manoeuvre only."
    slot_uri: openlabel_v2:motionAccelerateEgoValue
    any_of:
      - range: decimal
      - range: QuantitativeValue

  motionAccelerateTrafficAgentValue:
    description: Rate of acceleration of a traffic agent (m/s²).
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.3.2"
    aliases:
      - "Rate of acceleration (ms-2)"
    notes:
      - "Quantification of the manoeuvre is an extension of the internal ontology; BSI Flex 1891 defines the manoeuvre only."
    slot_uri: openlabel_v2:motionAccelerateTrafficAgentValue
    any_of:
      - range: decimal
      - range: QuantitativeValue

  motionDecelerateValue:
    description: Rate of deceleration (m/s²).
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.3.3"
    aliases:
      - "Rate of deceleration (ms-2)"
    notes:
      - "Quantification of the manoeuvre is an extension of the internal ontology; BSI Flex 1891 defines the manoeuvre only."
    slot_uri: openlabel_v2:motionDecelerateValue
    any_of:
      - range: decimal
      - range: QuantitativeValue

  motionDriveValue:
    description: Speed (km/h).
    comments:
      - "BSI Flex 1891 v1.0:2025-01, 5.4.2.2.2"
    aliases:
      - "Speed (km/h)"
    notes:
      - "Quantification of the manoeuvre is an extension of the internal ontology; BSI Flex 1891 defines the manoeuvre only."
    slot_uri: openlabel_v2:motionDriveValue
    any_of:
      - range: decimal
      - range: QuantitativeValue

