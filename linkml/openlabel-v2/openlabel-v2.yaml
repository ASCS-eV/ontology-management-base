    description: Types of human road users.
    comments:
      - "ISO 34504:2023, 4.4.4.1 (Road user type — pedestrian/cyclist sub-tags)"
    notes:
      - "ISO 34504 lists pedestrian sub-tags: child, adult, person with disabilities, hearing-impaired, visually-impaired, road-works crew, person pushing stroller, person in wheelchair, etc. Cyclist sub-tags: bicyclist, e-Bike user, skater, motorcycle, moped/scooter. ASAM OpenLABEL uses role-based categories."
    permissible_values:
      HumanAnimalRider:
        description: Animal rider (e.g. horse rider).
        meaning: openlabel_v2:HumanAnimalRider
      HumanCyclist:
        description: Cyclist.
        meaning: openlabel_v2:HumanCyclist
