  # Road User Vehicle
  # ---------------------------------------------------------------------------
  RoadUserVehicleEnum:
    description: Types of vehicles.
    comments:
      - "ISO 34504:2023, 4.4.4.1 (Road user type — vehicle sub-tags)"
    notes:
      - "ISO 34504 lists: passenger car, bus, school bus, truck, tram, goods vehicle, dangerous goods vehicle, long/large vehicle, agricultural vehicle, fire truck, ambulance, police vehicle, rescue vehicle, crane/NRMM, disabled vehicle, etc. ASAM OpenLABEL uses a simplified aggregation."
    permissible_values:
      VehicleAgricultural:
        description: Agricultural vehicle.
        meaning: openlabel_v2:VehicleAgricultural
      VehicleBus:
        description: Bus.
        meaning: openlabel_v2:VehicleBus
      VehicleCar:
        description: Car.
        meaning: openlabel_v2:VehicleCar
      VehicleConstruction:
        description: Construction vehicle.
        meaning: openlabel_v2:VehicleConstruction
      VehicleCycle:
        description: Cycle.
        meaning: openlabel_v2:VehicleCycle
      VehicleEmergency:
