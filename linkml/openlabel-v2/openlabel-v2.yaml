            SubjectVehicleSpeed:
              equals_string: "true"
      - description: >-
          If particulatesWaterValue is provided, ParticulatesWater must be true.
        preconditions:
          slot_conditions:
            particulatesWaterValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            ParticulatesWater:
              equals_string: "true"
      - description: >-
          EdgeNone is mutually exclusive with other drivable area edge types.
          If DrivableAreaEdge includes EdgeNone, no other edge values are allowed.
        comments:
          - "ISO 34503:2023, 9.3.6 — EdgeNone denotes absence of a defined edge boundary."
        preconditions:
          slot_conditions:
            DrivableAreaEdge:
              equals_string: "EdgeNone"
        postconditions:
          slot_conditions:
            DrivableAreaEdge:
              maximum_cardinality: 1

