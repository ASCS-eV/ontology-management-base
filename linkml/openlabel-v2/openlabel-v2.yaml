        meaning: openlabel_v2:VehicleEmergency
      VehicleMotorcycle:
        description: Motorcycle.
        meaning: openlabel_v2:VehicleMotorcycle
      VehicleTrailer:
        description: Trailer.
        meaning: openlabel_v2:VehicleTrailer
      VehicleTruck:
        description: Truck.
        meaning: openlabel_v2:VehicleTruck
      VehicleVan:
        description: Van.
        meaning: openlabel_v2:VehicleVan
      VehicleWheelchair:
        description: Wheelchair.
