      - description: >-
          If weatherWindValue is provided, WeatherWind must be true.
        preconditions:
          slot_conditions:
            weatherWindValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            WeatherWind:
              equals_string: "true"
      - description: >-
          If weatherRainValue is provided, WeatherRain must be true.
        preconditions:
          slot_conditions:
            weatherRainValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            WeatherRain:
              equals_string: "true"
      - description: >-
          If weatherSnowValue is provided, WeatherSnow must be true.
        preconditions:
          slot_conditions:
            weatherSnowValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            WeatherSnow:
              equals_string: "true"
      - description: >-
          If illuminationCloudinessValue is provided, IlluminationCloudiness must be true.
        preconditions:
          slot_conditions:
            illuminationCloudinessValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            IlluminationCloudiness:
              equals_string: "true"
      - description: >-
          If daySunElevationValue is provided, DaySunElevation must be true.
        preconditions:
          slot_conditions:
            daySunElevationValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            DaySunElevation:
              equals_string: "true"
      - description: >-
          If trafficAgentDensityValue is provided, TrafficAgentDensity must be true.
        preconditions:
          slot_conditions:
            trafficAgentDensityValue:
              value_presence: PRESENT
        postconditions:
