# ASAM OpenLABEL Scenario Tagging Ontology v2
# Modeled in LinkML as single source of truth.
# Generates: OWL ontology, SHACL shapes, JSON-LD context.
#
# Based on ASAM OpenLABEL V1.0.0 (ISO 34503:2023, formerly BSI PAS 1883:2020) with ASCS-eV namespace.
# For details, see https://www.asam.net/project-detail/asam-openlabel-v100
#
# =============================================================================
# Field Usage Convention
# =============================================================================
#
# Each slot, class, and enum in this schema uses LinkML metadata fields with
# the following strict semantics:
#
#   description   Clean semantic definition of the concept. No references,
#                 no provenance, no section numbers. Should be understandable
#                 without consulting any standard.
#
#   comments      Normative reference: the precise clause or sub-item in the
#                 governing standard. Format: "ISO 34503:2023, Clause N" for
#                 top-level clauses or "ISO 34503:2023, N.N.N" for subclauses,
#                 with lettered items as "N.N.N x)" per ISO numbering.
#                 (LinkML's `source` field requires a URI; `comments` is used
#                 for free-text citations instead.)
#
#   see_also      Resolvable URL(s) for the referenced standard's catalog page.
#                 Generates rdfs:seeAlso in OWL output.
#
#   aliases       Previous formal identifiers or labels for this element
#                 (e.g. the v1 OWL IRI local-name when an element was renamed).
#                 Generates skos:altLabel. Only actual names that existed in
#                 code/data — never paraphrased natural-language descriptions.
#
#   notes         Migration provenance and editorial context for maintainers.
#                 Documents what changed between versions and why.
#                 Not rendered in end-user documentation.
#
# =============================================================================
# Migration Context — PAS 1883:2020 → ISO 34503:2023
# =============================================================================
#
# The v1 ontology (openlabel.owl.ttl) referenced:
#
#   BSI PAS 1883:2020 — Operational Design Domain (ODD) taxonomy for
#   automated driving systems. Published by BSI (British Standards Institution).
#   URL: https://www.bsigroup.com/en-GB/CAV/pas-1883
#
# PAS 1883:2020 has since been superseded by the international standard:
#
#   ISO 34503:2023 — Road vehicles — Test scenarios for automated driving
#   systems — Specification for operational design domain.
#   ISO/TC 22/SC 33. Geneva: International Organization for Standardization.
#   URL: https://www.iso.org/standard/78952.html
#
# Additional normative references:
#
#   PAS 1883:2025 — Operational design domain — Implementation of
#   BS ISO 34503:2023 — Guide. Supersedes PAS 1883:2020. Clause 5 extends the
#   ISO 34503 taxonomy: 5.1 motor vehicle types, 5.2 vulnerable road users,
#   5.4 attributes associated with the UK National Risk Register.
#
#   BSI Flex 1891 v1.0:2025-01 — Behaviour taxonomy for automated driving
#   system (ADS) applications — Specification. Clause 5: signalling (5.2),
#   positioning (5.3) and manoeuvre (5.4) behaviours. Used for Behaviour;
#   replaces the earlier ISO 34504:2023, 4.4.4 references.
#
# Structural correspondence:
#
#   PAS 1883:2020 Section 5     →  ISO 34503:2023 Clauses 8–11 (ODD taxonomy)
#   PAS 1883:2020 Section 5.2   →  ISO 34503:2023 Clause 9  (Scenery elements)
#   PAS 1883:2020 Section 5.3   →  ISO 34503:2023 Clause 10 (Environmental conditions)
#   PAS 1883:2020 Section 5.4   →  ISO 34503:2023 Clause 11 (Dynamic elements)
#
# Key terminology changes:
#
#   PAS 1883 term                  →  ISO 34503 term
#   ─────────────────────────────────────────────────────────────────────
#   "fixed road structures"        →  "basic road structures" (Sec. 9.5)
#   "temporary road structures"    →  "temporary drivable area structures" (Sec. 9.7)
#   "special structures"           →  "special structures" (Sec. 9.6, unchanged)
#   "road type"                    →  "drivable area type" (Sec. 9.3.2)
#   "road geometry"                →  "drivable area geometry" (Sec. 9.3.3)
#
# Identifier renaming policy (v1 → v2):
#   Where ISO 34503 introduced new terminology, v2 adopts the ISO term as the
#   canonical identifier and records the v1 identifier in `aliases`. This
#   enables forward alignment with the international standard while preserving
#   discoverability of the legacy name via skos:altLabel.
#
# =============================================================================
# ISO 34503 alignment with the ASCS internal OpenLABEL ontology
# =============================================================================
#
# The ODD (ISO 34503:2023) part of this schema mirrors the internally updated
# OpenLABEL OWL ontology. Its class hierarchy is flattened as follows:
#
#   - a class with sub-classes becomes a slot whose enum lists its leaves and
#     its meaningful intermediate classes (e.g. FixedZone, RoundaboutCompact);
#   - pure grouping classes (ZoneType, SignType, TransverseType,
#     ParticulatesType, SpecialStructuresType, CommunicationType,
#     CommunicationTechnology, CommunicationDownlink/Uplink) are not modelled;
#   - a class carrying a datatype property becomes a boolean flag slot plus a
#     value slot, linked by a conditional rule (e.g. LaneSpecificationSpeedLimit
#     + SpeedLimit).
#
# PAS 1883:2025 extensions are added as values of the ISO 34503 enums they
# extend (comment "PAS 1883:2025, 5.x"). Behaviour follows the BSI Flex 1891
# taxonomy of the internal ontology; the former ASAM OpenLABEL
# BehaviourCommunication slot, MotionAway, MotionTowards, MotionTurn and the
# ISO 34504 based RoadUser class were removed because the internal ontology
# does not contain them (road users are covered by trafficAgentTypeValue).
#
# =============================================================================

id: https://w3id.org/ascs-ev/envited-x/openlabel/v2
name: openlabel-v2
title: ASAM OpenLABEL Scenario Tagging Ontology
description: >-
  Ontology for scenario tagging based on the ASAM OpenLABEL standard
  and ISO 34503:2023 Operational Design Domain taxonomy.
version: "2.0.0"
license: https://www.eclipse.org/legal/epl-2.0/

prefixes:
  linkml: https://w3id.org/linkml/
  openlabel_v2: https://w3id.org/ascs-ev/envited-x/openlabel/v2/
  sdo: https://schema.org/
  cmns-q: https://www.omg.org/spec/Commons/Quantities/

default_prefix: openlabel_v2
default_range: string

imports:
  - linkml:types

# =============================================================================
# Classes
# =============================================================================
classes:

  # ---------------------------------------------------------------------------
  # Scenario (top-level container)
  # ---------------------------------------------------------------------------
  Scenario:
    description: >-
      A scenario that can be tagged with OpenLABEL tags.
    class_uri: openlabel_v2:Scenario
    slots:
      - hasTag

  # ---------------------------------------------------------------------------
  # Tag (base tag - main entry point for SHACL validation)
  # ---------------------------------------------------------------------------
  Tag:
    description: The base tag.
    class_uri: openlabel_v2:Tag
    slots:
      - AdminTag
      - Behaviour
      - Odd

  # ---------------------------------------------------------------------------
  # AdminTag
  # ---------------------------------------------------------------------------
  AdminTag:
    description: >-
      The base tag to use when extending the Administration tags with new classes.
    class_uri: openlabel_v2:AdminTag
    slots:
      - licenseURI
      - ownerEmail
      - ownerName
      - ownerURL
      - scenarioCreatedDate
      - scenarioDefinition
      - scenarioDefinitionLanguageURI
      - scenarioDescription
      - scenarioName
      - scenarioParentReference
      - scenarioUniqueReference
      - scenarioVersion
      - scenarioVisualisationURL

  # ---------------------------------------------------------------------------
  # Behaviour (BSI Flex 1891 v1.0:2025-01)
  # ---------------------------------------------------------------------------
  Behaviour:
    description: >-
      Act that changes the state or position of an on-road actor, classified
      into signalling, positioning and manoeuvre behaviours.
    comments:
      - "BSI Flex 1891 v1.0:2025-01, Clause 5"
    notes:
      - "Aligned with the internal OpenLABEL ontology, which follows BSI Flex 1891. Previously referenced ISO 34504:2023, 4.4.4."
      - "Internal hierarchy: BehaviourSignalling (5.2); BehaviourPositioning (5.3); BehaviourMotion (manoeuvre, 5.4) with AbsoluteManoeuvre (vehicle tactical, vehicle operational, non-vehicle tactical, non-vehicle operational) and RelativeManoeuvre. Manoeuvres are modelled as boolean flags."
      - "Conditional rules (boolean+value co-occurrence) are ontology integrity constraints motivated by ISO 34503:2023, 12.4 (conditional attribute dependencies in ODD specifications)."
    class_uri: openlabel_v2:Behaviour
    slots:
      - BehaviourPositioning
      - BehaviourSignalling
      - MotionAccelerate
      - MotionAccelerateEgo
      - motionAccelerateEgoValue
      - MotionAccelerateTrafficAgent
      - motionAccelerateTrafficAgentValue
      - MotionCross
      - MotionCutAcross
      - MotionCutIn
      - MotionCutOut
      - MotionDecelerate
      - motionDecelerateValue
      - MotionDrive
      - motionDriveValue
      - MotionLaneChange
      - MotionLaneChangeLeft
      - MotionLaneChangeRight
      - MotionNonVehicleJog
      - MotionNonVehicleTurnLeft
      - MotionNonVehicleTurnRight
      - MotionNonVehicleWait
      - MotionOvertake
      - MotionParkingManoeuvre
      - MotionPass
      - MotionReverse
      - MotionRun
      - MotionSlide
      - MotionStop
      - MotionTurnLeft
      - MotionTurnRight
      - MotionUTurn
      - MotionWalk
      - MotionYield
    rules:
      - description: >-
          If motionAccelerateEgoValue is provided, MotionAccelerateEgo must be true.
        preconditions:
          slot_conditions:
            motionAccelerateEgoValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            MotionAccelerateEgo:
              equals_string: "true"
      - description: >-
          If motionAccelerateTrafficAgentValue is provided, MotionAccelerateTrafficAgent must be true.
        preconditions:
          slot_conditions:
            motionAccelerateTrafficAgentValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            MotionAccelerateTrafficAgent:
              equals_string: "true"
      - description: >-
          If motionDecelerateValue is provided, MotionDecelerate must be true.
        preconditions:
          slot_conditions:
            motionDecelerateValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            MotionDecelerate:
              equals_string: "true"
      - description: >-
          If motionDriveValue is provided, MotionDrive must be true.
        preconditions:
          slot_conditions:
            motionDriveValue:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            MotionDrive:
              equals_string: "true"

