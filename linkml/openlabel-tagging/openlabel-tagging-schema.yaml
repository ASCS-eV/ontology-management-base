# ASAM OpenLABEL Scenario Tagging File Format Schema
# =============================================================================
#
# This LinkML schema models the STRUCTURAL format of ASAM OpenLABEL v1.0.0
# scenario tagging JSON files. It generates a JSON Schema that validates the
# file format (structure, keys, required fields) AND the tag vocabulary
# (valid tag.type values derived from the openlabel-tagging ontology).
#
# Architecture:
#   openlabel-tagging.yaml         -> Semantic model (OWL, SHACL, JSON-LD context)
#   openlabel-tagging-schema.yaml  -> Structural model (JSON Schema for v1 format)
#   tag-types.yaml                 -> TagTypeEnum, generated from the semantic model
#
# TagTypeEnum bridges both: scripts/sync_tag_type_enum.py derives every valid
# tag.type value from the semantic model into tag-types.yaml, which this schema
# imports (the pre-commit hook regenerates it before the artifacts).
#
# Usage (with the flags in jsonschema.genopts):
#   just generate-domain openlabel-tagging
#
# =============================================================================

id: https://w3id.org/ascs-ev/envited-x/openlabel/schema/v1
name: openlabel-tagging-schema
title: ASAM OpenLABEL Scenario Tagging File Format Schema
description: >-
  Structural schema for the scenario tagging profile of ASAM OpenLABEL v1.0.0
  (spec section 8). Fully models the tagging sections (openlabel root, metadata,
  ontologies, tags, tag_data, resources) and constrains tag.type values to the
  openlabel-tagging ontology vocabulary. The labelling sections (objects, frames,
  actions, ...) are accepted but deliberately left unvalidated, so that a file
  combining tags with labelling data still validates (spec 8.1.1). A valid result
  from this schema therefore does not mean the whole document was checked: every
  section it accepts without checking is typed by a definition of the Unchecked
  family (UncheckedSection, UncheckedUidEntry, UncheckedFrameEntry), so a consumer
  can list the skipped sections by collecting the properties of openlabel whose
  schema references a "#/$defs/Unchecked..." definition.
version: "1.1.0-alpha"
license: https://www.eclipse.org/legal/epl-2.0/

prefixes:
  linkml: https://w3id.org/linkml/
  openlabel_schema: https://w3id.org/ascs-ev/envited-x/openlabel/schema/v1/

default_prefix: openlabel_schema

imports:
  - linkml:types
  - tag-types

# =============================================================================
# Classes
# =============================================================================
classes:

  # ---------------------------------------------------------------------------
  # Root wrapper: {"openlabel": {...}}
  # ---------------------------------------------------------------------------
  OpenLabelFile:
    tree_root: true
    description: >-
      Root of an ASAM OpenLABEL JSON file. Contains a single "openlabel" key.
    attributes:
      openlabel:
        range: OpenLabel
        required: true
        description: The OpenLABEL root object containing all annotation data.

  # ---------------------------------------------------------------------------
  # OpenLabel container (scenario tagging subset)
  # ---------------------------------------------------------------------------
  OpenLabel:
    description: >-
      The OpenLABEL root JSON object. This profile fully validates the scenario
      tagging sections (metadata, ontologies, tags, resources); tags themselves carry no
      spatiotemporal or geometric constructs (spec 8.1). The labelling sections
      are accepted as unvalidated passthrough because spec 8.1.1 allows a
      labelling instance to be used as the raw data for tagging, so a conformant
      file may legitimately carry both.
    attributes:
      metadata:
        range: Metadata
        required: true
        description: >-
          Metadata about the annotation file (schema version, annotator, etc.).
      ontologies:
        range: OntologyEntry
        multivalued: true
        inlined: true
        inlined_as_list: false
        description: >-
          Ontology references keyed by UID. Each entry specifies the URI
          of an ontology and optional tagging boundary controls.
      tags:
        range: TagEntry
        multivalued: true
        inlined: true
        inlined_as_list: false
        description: >-
          Tags keyed by UID. Each entry specifies the tag type (from an
          ontology) and optional tag_data with values.
      resources:
        range: ResourceEntry
        multivalued: true
        inlined: true
        inlined_as_list: false
        description: >-
          External resources keyed by UID, each a string such as a file name or
          URL. A tag's resource_uid refers to elements of these resources.

      # -- Labelling sections: accepted, deliberately not validated here -------
      # These are the remaining 9 properties of ASAM's "openlabel" object.
      # ASAM declares openlabel with "additionalProperties": false, so this
      # profile must enumerate them to stay a refinement rather than a
      # restriction: omitting them would reject a conformant file that carries
      # tags alongside labelling data (spec 8.1.1). They are ranged on the Unchecked
      # family because validating them is the job of a full labelling profile, not of
      # a tagging profile. A validator SHOULD report their presence so that
      # "valid" is never mistaken for "fully checked".
      objects:
        range: UncheckedUidEntry
        multivalued: true
        inlined: true
        inlined_as_list: false
        description: Labelling section, outside this profile's scope.
      frames:
        range: UncheckedFrameEntry
        multivalued: true
        inlined: true
        inlined_as_list: false
        description: Labelling section, outside this profile's scope.
      contexts:
        range: UncheckedUidEntry
        multivalued: true
        inlined: true
        inlined_as_list: false
        description: Labelling section, outside this profile's scope.
      actions:
        range: UncheckedUidEntry
        multivalued: true
        inlined: true
        inlined_as_list: false
        description: Labelling section, outside this profile's scope.
      events:
        range: UncheckedUidEntry
        multivalued: true
        inlined: true
        inlined_as_list: false
        description: Labelling section, outside this profile's scope.
      relations:
        range: UncheckedUidEntry
        multivalued: true
        inlined: true
        inlined_as_list: false
        description: Labelling section, outside this profile's scope.
      streams:
        range: UncheckedSection
        inlined: true
        description: Labelling section, outside this profile's scope.
      coordinate_systems:
        range: UncheckedSection
        inlined: true
        description: Labelling section, outside this profile's scope.
      frame_intervals:
        range: UncheckedSection
        # Must be multivalued: ASAM types frame_intervals as an array, and
        # linkml:Any generates type [null, boolean, object, number, string]
        # with "array" absent, so a single-valued Any slot would reject it.
        multivalued: true
        inlined_as_list: true
        description: Labelling section, outside this profile's scope.

  # ---------------------------------------------------------------------------
  # UncheckedSection - unconstrained passthrough
  # ---------------------------------------------------------------------------
  UncheckedSection:
    extra_slots:
      allowed: true
    description: >-
      An OpenLABEL section that this profile accepts but deliberately does not
      validate. Used for the sections outside the tagging scope: they are
      accepted so that tagging data embedded in a labelling file validates
      (spec 8.1.1), but their contents are not checked here.

      Modelled as an OPEN OBJECT -- `{"type": "object", "additionalProperties":
      true}` -- not as an unconstrained JSON value. ASAM types every one of
      these sections as an object, so accepting a scalar (`true`, `null`, `""`)
      would make this profile accept documents ASAM rejects, breaking the
      refinement relation. `extra_slots.allowed` keeps the object open without
      widening its type; `class_uri: linkml:Any` would emit the 5-type union
      `["null","boolean","object","number","string"]` and is therefore unsound
      here. See REFINEMENT_PROOF.md.

      A reference to this definition, or to UncheckedUidEntry or
      UncheckedFrameEntry, is the marker that distinguishes "accepted" from
      "validated": a consumer that reports a document valid should also report
      which of its sections resolved to the Unchecked family, so that "valid" is
      never read as "fully checked".

  UncheckedUidEntry:
    description: >-
      A passthrough entry in a UID-keyed OpenLABEL section (objects, contexts,
      actions, events, relations). The VALUE is deliberately not
      validated here, but the KEY is: ASAM constrains these dict keys to a
      numeric UID or a UUID and closes the object, so accepting an arbitrary
      key would make this profile accept documents ASAM rejects.
    extra_slots:
      allowed: true
    attributes:
      uid:
        identifier: true
        range: string
        required: true
        pattern: "^(-?[0-9]+|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$"
        description: >-
          Numeric UID or UUID. Constrains the dict keys of the enclosing
          section, rendered as JSON Schema propertyNames.

  UncheckedFrameEntry:
    description: >-
      A passthrough entry in the frame-keyed `frames` section. As with
      UncheckedUidEntry the value is unvalidated, but ASAM keys frames by
      frame number (`^[0-9]+$`) and closes the object, so the key pattern is
      enforced to preserve the refinement relation.
    extra_slots:
      allowed: true
    attributes:
      frame_num:
        identifier: true
        range: string
        required: true
        pattern: "^[0-9]+$"
        description: >-
          Frame number. Constrains the dict keys of `frames`, rendered as
          JSON Schema propertyNames.

  # ---------------------------------------------------------------------------
  # Metadata
  # ---------------------------------------------------------------------------
  Metadata:
    description: >-
      Metadata about the annotation file. The schema_version is mandatory.
    # ASAM's JSON Schema declares metadata with "additionalProperties": true: it
    # is the file format's designated extension point, and real producers put
    # toolchain metadata (ScenarioId, OpenXAvailability, Entities, ...) next to
    # the ASAM-defined keys. Closing it would reject those producers' files, so
    # unlike the data entries (num, vec, text, boolean), metadata stays open.
    extra_slots:
      allowed: true
    attributes:
      schema_version:
        range: string
        required: true
        equals_string: "1.0.0"
        description: >-
          The version of the ASAM OpenLABEL schema this file conforms to.
          ASAM constrains this to "1.0.0".
      tagged_file:
        range: string
        description: >-
          Path or URI to the raw data file that this annotation references.
      annotator:
        range: string
        description: Name or identifier of the annotator.
      comment:
        range: string
        description: Free-text comment about the annotation.
      name:
        range: string
        description: Name of the annotation file.
      file_version:
        range: string
        description: Version of the annotation file.

  # ---------------------------------------------------------------------------
  # OntologyEntry
  # ---------------------------------------------------------------------------
  OntologyEntry:
    description: >-
      An ontology reference. Specifies the URI of the ontology and optional
      boundary controls for tagging subsets (spec 8.2.2).
    attributes:
      uid:
        identifier: true
        range: string
        required: true
        pattern: "^(-?[0-9]+|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$"
        description: >-
          Unique identifier for this ontology entry (numeric UID or UUID). The
          pattern constrains the dict keys in the ontologies object (ASAM:
          numeric UID or UUID), rendered as JSON Schema propertyNames.
      uri:
        range: uri
        required: true
        description: >-
          URI of the ontology definition (RDF Turtle file URL).
      boundary_list:
        range: string
        multivalued: true
        description: >-
          List of tag names that define the tagging boundary. Used with
          boundary_mode to specify which subset of ontology tags is relevant.
      boundary_mode:
        range: BoundaryModeEnum
        description: >-
          Whether boundary_list specifies inclusion or exclusion of tags.

  # ---------------------------------------------------------------------------
  # TagEntry
  # ---------------------------------------------------------------------------
  TagEntry:
    description: >-
      A single tag in an ASAM OpenLABEL file. References a tag type from an
      ontology and optionally includes tag_data with values.
    # ASAM declares tag with "additionalProperties": true (spec 8.2.1), so a tag
    # may carry producer-specific keys alongside type/ontology_uid/resource_uid/
    # tag_data. Real files use that to put the tagged value next to the type
    # (e.g. "motionDriveValue": 60), so closing this rejects conformant files.
    extra_slots:
      allowed: true
    attributes:
      uid:
        identifier: true
        range: string
        required: true
        pattern: "^(-?[0-9]+|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$"
        description: >-
          Unique identifier for this tag entry (numeric UID or UUID). The pattern
          constrains the dict keys in the tags object (ASAM: numeric UID or UUID),
          rendered as JSON Schema propertyNames.
      type:
        range: TagTypeEnum
        required: true
        description: >-
          The type of tag, referencing a class or property name from the
          ontology. Constrained to valid values from the openlabel-tagging vocabulary.
      ontology_uid:
        range: string
        required: true
        description: >-
          UID of the ontology (from the ontologies section) where this tag
          type is defined. Required per the normative property table for the
          tag class (spec 8, Table 26: ontology_uid, Required = true). ASAM's
          own JSON Schema lists only "type" in "required", contradicting that
          table; this profile follows the normative text. All spec examples and
          all conformant files we have seen include ontology_uid, and keeping
          it required also avoids a LinkML simple-dict shorthand ASAM forbids.
      resource_uid:
        range: ResourceUid
        multivalued: true
        inlined: true
        inlined_as_list: false
        description: >-
          Links to external resources, keyed by UID (ASAM resource_uid: a map of
          id -> the element's identifier string in the external resource).
      tag_data:
        any_of:
          - range: TagData
          - range: string
        description: >-
          Optional data associated with this tag (values, ranges, text).
          ASAM models tag_data as oneOf[object, string]; both forms are allowed.

  # ---------------------------------------------------------------------------
  # TagData - generic data container (spec 8.7)
  # ---------------------------------------------------------------------------
  TagData:
    description: >-
      Generic data associated with a tag. Contains arrays of typed values
      (boolean, numeric, text, vector). For scenario tagging, only non-geometric
      data types are used (spec 8.7).
    attributes:
      boolean:
        range: BooleanVal
        multivalued: true
        inlined_as_list: true
        description: List of boolean values describing this tag.
      num:
        range: NumVal
        multivalued: true
        inlined_as_list: true
        description: List of numeric values describing this tag.
      text:
        range: TextVal
        multivalued: true
        inlined_as_list: true
        description: List of text values describing this tag.
      vec:
        range: VecVal
        multivalued: true
        inlined_as_list: true
        description: List of vector (array) values describing this tag.

  # ---------------------------------------------------------------------------
  # Generic data types (boolean, num, text, vec) - spec 8.7.1-8.7.4
  # ---------------------------------------------------------------------------
  BooleanVal:
    description: >-
      A boolean value entry in tag_data or attributes (spec 8.7.1).
    attributes:
      name:
        range: string
        description: Name of this data entry (used as index in data pointers).
      val:
        range: boolean
        required: true
        description: The boolean value.
      type:
        range: ValueOnlyTypeEnum
        description: How the value shall be interpreted (ASAM allows only "value").
      attributes:
        range: Attributes
        description: Nested attributes for this data entry.

  NumVal:
    description: >-
      A numeric value entry in tag_data or attributes (spec 8.7.2).
    attributes:
      name:
        range: string
        description: Name of this data entry.
      val:
        range: float
        required: true
        description: >-
          The numerical value. Modelled as a number to match the ASAM JSON
          Schema (num.val type=number). NOTE: spec 8.2.4's prose example shows
          "val": "3.1" (a string), which is inconsistent with the ASAM schema;
          the schema (number) is authoritative.
      type:
        range: NumTypeEnum
        description: >-
          How the number shall be interpreted: value, minimum, or maximum.
      attributes:
        range: Attributes
        description: Nested attributes for this data entry.

  TextVal:
    description: >-
      A text value entry in tag_data or attributes (spec 8.7.3).
    attributes:
      name:
        range: string
        description: Name of this data entry.
      val:
        range: string
        required: true
        description: The text value.
      type:
        range: ValueOnlyTypeEnum
        description: How the text shall be interpreted (ASAM allows only "value").
      attributes:
        range: Attributes
        description: Nested attributes for this data entry.

  VecVal:
    description: >-
      A vector (array) value entry in tag_data or attributes (spec 8.7.4).
      Used for ranges, sets, and multi-valued data.
    attributes:
      name:
        range: string
        description: Name of this data entry.
      val:
        multivalued: true
        required: true
        any_of:
          - range: float
          - range: string
        description: >-
          Array of values. ASAM vec.val items are oneOf[number, string]
          (e.g. a numeric range [3.4, 3.7] or a set [2, 3]).
      type:
        range: VecTypeEnum
        description: >-
          How the vector shall be interpreted: range or values (ASAM vec.type).
      attributes:
        range: Attributes
        description: Nested attributes for this data entry.

  # ---------------------------------------------------------------------------
  # Attributes - recursive nested data container
  # ---------------------------------------------------------------------------
  Attributes:
    description: >-
      Nested attributes for any data entry. Same structure as tag_data.
    attributes:
      boolean:
        range: BooleanVal
        multivalued: true
        inlined_as_list: true
        description: Nested boolean attributes.
      num:
        range: NumVal
        multivalued: true
        inlined_as_list: true
        description: Nested numeric attributes.
      text:
        range: TextVal
        multivalued: true
        inlined_as_list: true
        description: Nested text attributes.
      vec:
        range: VecVal
        multivalued: true
        inlined_as_list: true
        description: Nested vector attributes.

  # ---------------------------------------------------------------------------
  # ResourceUid - external resource references
  # ---------------------------------------------------------------------------
  ResourceEntry:
    description: >-
      An external resource used by this annotation (ASAM resources): a map keyed
      by a numeric/UUID id whose value is a string that names the resource, such
      as a file name or URL.
    attributes:
      uid:
        identifier: true
        range: string
        pattern: "^(-?[0-9]+|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$"
        description: Resource key (numeric UID or UUID).
      resource:
        range: string
        required: true
        description: The external resource, e.g. a file name or URL.

  ResourceUid:
    description: >-
      A reference to an element in an external resource (ASAM resource_uid): a map
      keyed by a numeric/UUID id whose value is the element's identifier string in
      the external resource.
    attributes:
      uid:
        identifier: true
        range: string
        pattern: "^(-?[0-9]+|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$"
        description: External-resource reference key (numeric UID or UUID).
      identifier_in_resource:
        range: string
        required: true
        description: Identifier of the element in the external resource.

# =============================================================================
# Enums
# =============================================================================
enums:

  BoundaryModeEnum:
    description: >-
      Mode for interpreting the ontology tagging boundary (spec 8.2.2).
    permissible_values:
      include:
        description: >-
          Subset is the boundary tags plus their ascendants.
      exclude:
        description: >-
          Subset is all tags minus boundary tags and their descendants.

  NumTypeEnum:
    description: >-
      How a numeric value shall be interpreted in its context.
    permissible_values:
      value:
        description: The number represents a single value.
      min:
        description: The number represents a minimum bound.
      max:
        description: The number represents a maximum bound.

  VecTypeEnum:
    description: >-
      How a vector (array) value shall be interpreted (ASAM: range or values).
    permissible_values:
      range:
        description: Two-element array [min, max] defining a value range.
      values:
        description: Ordered list of discrete values.

  ValueOnlyTypeEnum:
    description: >-
      Interpretation for boolean/text data entries. ASAM allows only "value".
    permissible_values:
      value:
        description: The entry represents a single value.

